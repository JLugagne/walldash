services:
  ha-dash:
    image: ha-dash:test
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ha-dash
    restart: unless-stopped
    entrypoint: ["sh", "-c", "/app/ha-dash"]
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8080
      - DB_PATH=/app/data/ha-dash.db
      - HA_URL=${HA_URL:-http://homeassistant.local:8123}
      - HA_TOKEN=${HA_TOKEN:-}
    volumes:
      - ha-dash-data:/app/data

volumes:
  ha-dash-data:
