services:
  walldash:
    image: walldash:test
    build:
      context: .
      dockerfile: Dockerfile
    container_name: walldash
    restart: unless-stopped
    entrypoint: ["sh", "-c", "/app/walldash"]
    ports:
      - "9090:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8080
      - DB_PATH=/app/data/walldash.db
      - HA_URL=${HA_URL:-http://homeassistant.local:8123}
      - HA_TOKEN=${HA_TOKEN:-}
    volumes:
      - walldash-data:/app/data

volumes:
  walldash-data:
