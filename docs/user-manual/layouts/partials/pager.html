{{ $prev := .PrevInSection }}
{{ $next := .NextInSection }}
{{ if or $prev $next }}
<nav class="pager" aria-label="Page navigation">
  {{ with $prev }}
    <a class="pager__link pager__link--prev" href="{{ .RelPermalink }}">
      <span class="pager__dir">Previous</span>
      <span class="pager__title">{{ .Title }}</span>
    </a>
  {{ else }}<span></span>{{ end }}
  {{ with $next }}
    <a class="pager__link pager__link--next" href="{{ .RelPermalink }}">
      <span class="pager__dir">Next</span>
      <span class="pager__title">{{ .Title }}</span>
    </a>
  {{ end }}
</nav>
{{ end }}
