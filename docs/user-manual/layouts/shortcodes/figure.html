{{- $src := .Get "src" -}}
{{- $img := printf "%s%s" site.Home.RelPermalink (strings.TrimPrefix "/" $src) -}}
{{- $alt := .Get "alt" | default (.Get "caption") -}}
{{- $caption := .Get "caption" -}}
<figure class="figure">
  <img src="{{ $img }}" alt="{{ $alt }}" loading="lazy" decoding="async">
  {{ with $caption }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
