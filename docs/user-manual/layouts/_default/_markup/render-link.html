{{- $dest := .Destination -}}
{{- $url := $dest -}}
{{- if and (hasPrefix $dest "/") (not (hasPrefix $dest "//")) -}}
  {{- $url = printf "%s%s" site.Home.RelPermalink (strings.TrimPrefix "/" $dest) -}}
{{- end -}}
<a href="{{ $url | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}>{{ .Text | safeHTML }}</a>
